name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
      test_level: full
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # pinned to 1.12 for now; the test suite failed on 1.11
          - "1.12"
        os:
          - ubuntu-latest
          - macOS-latest
          
          - windows-latest
          
        arch:
          # "default" means the architecture of the runner executing the job
          - default
        allow_failure: [false]
